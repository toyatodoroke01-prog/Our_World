<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Our-World — ئەنیمێ • مانگا • بە کوردی</title>
<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/rwD7KZYf/IMG-20260929-231244-779.jpg">
<style>
/* ============ VARIABLES & RESET ============ */
:root{
  --bg:#0a0a0f; --card:#14141d; --card2:#181826; --line:rgba(255,255,255,.08);
  --txt:#ececf4; --mut:#9a9aab; --gold:#e8b64c; --red:#ef4444;
  --accent:#f97316; --accent-soft:rgba(249,115,22,.15);
  --radius:16px; --header-h:64px; --bottom-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
  font-size:14.5px; line-height:1.7; direction:rtl;
  padding-bottom:calc(var(--bottom-h) + 12px);
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block}
::selection{background:var(--accent);color:#0d0d12}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px}
.mut{color:var(--mut)}

/* ============ ANIMATIONS ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(4deg)}}
#view{animation:fadeUp .35s ease both}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:60;height:var(--header-h);
  background:rgba(10,10,15,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-in{max-width:1200px;margin:0 auto;height:100%;padding:0 14px;display:flex;align-items:center;gap:10px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  display:inline-flex;align-items:center;justify-content:center;transition:.2s;font-size:16px;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.tg{color:var(--accent)}
.icon-btn.tg:hover{background:var(--accent);color:#0d0d12}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand img{height:40px;width:40px;border-radius:11px;border:1px solid var(--line);object-fit:cover}
.brand b{font-size:16.5px;display:block;line-height:1.25;white-space:nowrap}
.brand small{font-size:10px;color:var(--mut);display:block;line-height:1.3;white-space:nowrap}
.top-links{display:none;gap:4px;margin-inline-start:8px}
.top-links a{padding:8px 13px;border-radius:10px;font-size:13.5px;color:var(--mut);transition:.2s}
.top-links a:hover{color:var(--txt);background:var(--card)}
.top-links a.active{color:var(--accent);background:var(--accent-soft);font-weight:700}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:110;opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-start:auto;right:0;width:min(330px,88vw);z-index:120;
  background:#10101a;border-inline-start:1px solid var(--line);
  transform:translateX(105%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  overflow-y:auto;padding:16px 16px 30px;
}
.drawer.on{transform:none}
.drawer h4{font-size:12px;color:var(--mut);margin:20px 2px 10px;font-weight:700}
.drawer .tg-col{display:grid;gap:9px}
.d-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.d-gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.d-tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center;font-size:12px;color:var(--txt);transition:.2s;display:block}
.d-tile:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.d-tile i{font-style:normal;font-size:21px;display:block;margin-bottom:4px}

/* ============ BUTTONS & INPUTS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#0d0d12;font-weight:700;font-size:14px;
  border:none;border-radius:12px;padding:11px 20px;transition:.2s;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
input,textarea,select{
  width:100%;background:#0e0e16;border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;color:var(--txt);font-size:14px;font-family:inherit;transition:.2s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:#5c5c6e}
label{display:block;font-size:12.5px;color:var(--mut);margin:13px 2px 6px;font-weight:700}

/* ============ HERO SLIDER ============ */
.hero{position:relative;height:330px;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-top:14px;background:#0d0d15}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none;display:flex;align-items:center;gap:16px;padding:22px}
.hero-slide.on{opacity:1;pointer-events:auto}
.hero-bg{position:absolute;inset:0}
.hero-mark{position:absolute;left:4%;bottom:-6%;font-size:170px;opacity:.13;animation:floatY 9s ease-in-out infinite;filter:blur(1px)}
.hero-info{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.hero-info h2{font-size:21px;line-height:1.35}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px}
.hero-p{font-size:12.5px;color:#c9c9d6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:520px}
.hero-poster{position:relative;flex:none;width:118px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.5);transition:.2s}
.hero-poster:hover{transform:scale(1.04)}
.hero-poster .p-emoji{font-size:44px}
.hero-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
.hero-dots button{width:8px;height:8px;border-radius:99px;border:none;background:rgba(255,255,255,.28);transition:.25s;padding:0}
.hero-dots button.on{width:22px;background:var(--accent)}

/* ============ SECTION & CARDS ============ */
section{margin-top:28px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sec-head::before{content:'';width:4px;height:22px;background:var(--accent);border-radius:4px;flex:none}
.sec-head h3{font-size:16px}
.sec-head a{margin-inline-start:auto;color:var(--accent);font-size:12.5px;font-weight:700;transition:.2s}
.sec-head a:hover{filter:brightness(1.2)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
.card{display:block;transition:.25s}
.card:hover{transform:translateY(-4px)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:border-color .25s;display:block}
.card:hover .poster,.hero-poster:hover{border-color:var(--accent)}
.p-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;text-shadow:0 6px 20px rgba(0,0,0,.5)}
.p-grad{position:absolute;inset-inline:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(6,6,10,.93),rgba(6,6,10,0))}
.p-title{position:absolute;inset-inline:0;bottom:0;padding:9px 10px;font-size:12.5px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:8px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:700;z-index:2}
.b-rate{inset-inline-start:8px;background:var(--gold);color:#221703}
.b-type{inset-inline-end:8px;background:var(--accent);color:#0d0d12}
.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--mut)}

/* ============ JOIN BANNER / FOOTER ============ */
.join{margin:34px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center}
.join h3{font-size:17px;margin-bottom:6px}
.join p{font-size:12.5px;color:var(--mut);max-width:460px;margin:0 auto 16px}
.join-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{margin-top:36px;border-top:1px solid var(--line);padding:26px 0 20px}
.footer-in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.footer-in img{height:44px;border-radius:11px}
footer .join-btns{margin-top:2px}
footer small{color:var(--mut);font-size:11px}

/* ============ PAGE HEADS / CATEGORIES ============ */
.page-head{margin-top:20px}
.page-head h2{font-size:20px}
.page-head p{font-size:12.5px;color:var(--mut)}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.type-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 14px;text-align:center;transition:.25s;display:block}
.type-card:hover{border-color:var(--accent);transform:translateY(-4px);background:var(--accent-soft)}
.type-card i{font-style:normal;font-size:32px;display:block}
.type-card b{display:block;font-size:14px;margin-top:7px}
.type-card span{font-size:11px;color:var(--mut)}
.gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.back-row{margin-top:16px}
.back-row button{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--mut);font-size:13px;padding:6px 0;transition:.2s}
.back-row button:hover{color:var(--accent)}

/* ============ SEARCH ============ */
.search-big{margin-top:20px}
.search-big input{padding:15px 18px;font-size:15px;border-radius:16px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:13px 2px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:12.5px;transition:.2s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0d0d12;font-weight:700}
.empty{padding:56px 16px;text-align:center;color:var(--mut)}
.empty i{font-style:normal;font-size:44px;display:block;margin-bottom:10px}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:4px}

/* ============ DETAIL ============ */
.d-hero{display:flex;gap:18px;margin-top:18px;align-items:flex-start}
.d-poster{flex:none;width:150px;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);position:relative;box-shadow:0 14px 36px rgba(0,0,0,.5)}
.d-poster .p-emoji{font-size:56px}
.d-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.d-info h2{font-size:19px;line-height:1.4}
.g-chips{display:flex;flex-wrap:wrap;gap:6px}
.g-chip{padding:4px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11px;color:var(--mut);transition:.2s}
.g-chip:hover{border-color:var(--accent);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-top:16px}
.panel h4{font-size:14.5px;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.panel h4::before{content:'';width:3.5px;height:17px;background:var(--accent);border-radius:3px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.ep{position:relative;background:#0e0e16;border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center;font-size:12.5px;color:var(--txt);transition:.2s;display:block}
.ep:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.ep.soon{opacity:.62}
.ep small{display:block;font-size:9.5px;color:var(--mut);margin-top:2px}
.ep.cur{background:var(--accent);border-color:var(--accent);color:#0d0d12;font-weight:700}
.ep.cur small{color:#0d0d12;opacity:.75}
.trow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border:none}
.cmt{display:flex;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cmt:last-child{border:none}
.cmt-av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.cmt b{font-size:13px}
.cmt p{font-size:13px;color:#c9c9d6;margin-top:2px;word-break:break-word}

/* ============ WATCH ============ */
.player{margin-top:16px;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.player iframe{width:100%;height:100%;border:0;display:block}
.player .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.player .fallback i{font-style:normal;font-size:44px}
.player .fallback span{font-size:13px;color:var(--mut);max-width:320px}
.watch-ctrl{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.note{display:flex;gap:9px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:11px 14px;font-size:11.5px;color:var(--mut);margin-top:14px}

/* ============ TEAM ============ */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-top:20px}
.team-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 16px;text-align:center;transition:.28s}
.team-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.team-card img{width:112px;height:112px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 10px 26px rgba(0,0,0,.4)}
.team-card b{font-size:15.5px;display:block}
.role{display:inline-block;margin-top:9px;padding:5px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;border:1px solid var(--accent-soft)}

/* ============ MORE / MENU ============ */
.user-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:13px;margin-top:18px}
.u-av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#0d0d12;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.user-box b{display:block;font-size:15px}
.user-box small{color:var(--mut);font-size:12px;direction:ltr;unicode-bidi:embed}
.menu{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.menu button,.menu a{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--txt);font-size:14px;transition:.2s;text-align:start}
.menu>:last-child{border-bottom:none}
.menu button:hover,.menu a:hover{background:var(--accent-soft);color:var(--accent)}
.menu .arr{margin-inline-start:auto;color:var(--mut);font-size:17px}

/* ============ ADMIN ============ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-grid .full{grid-column:1/-1}
.admin-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.admin-row:last-child{border:none}
.admin-row b{font-size:13.5px}
.tag{padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ar-btns{margin-inline-start:auto;display:flex;gap:7px}
.ar-btns button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0e0e16;color:var(--txt);font-size:14px;transition:.2s;display:flex;align-items:center;justify-content:center}
.ar-btns button:hover{border-color:var(--accent);color:var(--accent)}
.ar-btns button.armed{background:var(--red);border-color:var(--red);color:#fff;width:auto;padding:0 12px;font-size:12px;font-weight:700}

/* ============ MODAL ============ */
.modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);z-index:130;opacity:0;pointer-events:none;transition:.28s}
.modal{position:fixed;z-index:131;inset-inline:0;bottom:0;background:#15151f;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:84vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.22,1,.36,1)}
.modal-scrim.on{opacity:1;pointer-events:auto}
.modal.on{transform:none}
.modal h3{font-size:16px;margin-bottom:6px}
.modal .x{position:absolute;top:14px;inset-inline-start:14px;width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:15px}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:16px}
.theme-dot{background:none;border:none;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s}
.theme-dot span{width:36px;height:36px;border-radius:50%;background:var(--c);transition:.2s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.theme-dot:hover span{transform:scale(1.12)}
.theme-dot.sel span{box-shadow:0 0 0 3px #15151f,0 0 0 5.5px #fff}
.theme-dot.sel{color:var(--txt);font-weight:700}
.m-btns{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}

/* ============ TOASTS ============ */
#toast-root{position:fixed;top:calc(var(--header-h) + 10px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(360px,92vw);pointer-events:none}
.toast{background:#181826;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:13px;padding:11px 15px;font-size:13px;box-shadow:0 10px 34px rgba(0,0,0,.55);animation:toastIn .3s ease}
.toast.err{border-inline-start-color:var(--red)}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;bottom:0;inset-inline:0;z-index:90;height:calc(var(--bottom-h) + env(safe-area-inset-bottom));
  background:rgba(14,14,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{background:none;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;position:relative;transition:.2s;padding:0}
.bottom-nav button i{font-style:normal;font-size:19px;line-height:1}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav button.active::before{content:'';position:absolute;top:0;width:26px;height:3px;background:var(--accent);border-radius:0 0 4px 4px}

/* ============ DESKTOP ============ */
@media(min-width:640px){
  .hero{height:370px}
  .grid-cards{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:15px}
  .type-grid{grid-template-columns:repeat(4,1fr)}
  .gen-grid{grid-template-columns:repeat(6,1fr)}
  .d-poster{width:190px}
  .d-info h2{font-size:23px}
  .form-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:900px){
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .hamburger{display:none}
  .top-links{display:flex}
  .modal{inset-inline:auto;left:50%;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.96);width:min(460px,92vw);border-radius:20px;opacity:0;transition:.28s}
  .modal.on{transform:translate(-50%,-50%) scale(1);opacity:1}

const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in MEM ? MEM[k] : f); }catch(e){ return k in MEM ? MEM[k] : f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ MEM[k] = v; } }
};

function fmtViews(v){
  if(v >= 1e6) return (v/1e6).toFixed(1).replace('.0','') + 'M';
  if(v >= 1e3) return Math.round(v/1e3) + 'K';
  return String(v);
}
function hueOf(str){ let h = 0; for(const ch of String(str)) h = (h*31 + ch.codePointAt(0)) % 360; return h; }

/* ---------- state ---------- */
if(!store.get('ow_seeded', false)){
  store.set('ow_db', seedData());
  store.set('ow_seeded', true);
}
let DB       = store.get('ow_db', seedData());
let COMMENTS = store.get('ow_comments', {});
let USER     = store.get('ow_user', null);
let THEME    = store.get('ow_theme', 'orange');

const saveDB  = () => store.set('ow_db', DB);
const saveCMT = () => store.set('ow_comments', COMMENTS);

/* ---------- theme ---------- */
function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  THEME = t.id;
  document.documentElement.style.setProperty('--accent', t.c);
  document.documentElement.style.setProperty('--accent-soft', t.c + '26');
  store.set('ow_theme', t.id);
}
applyTheme(THEME);

/* ---------- toasts ---------- */
function toast(msg, type = 'ok'){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.35s'; }, 2600);
  setTimeout(() => el.remove(), 3050);
}

/* ---------- modal ---------- */
function openModal(html){
  $('#modal-root').innerHTML =
    `<div class="modal-scrim" id="m-scrim"></div>
     <div class="modal" id="m-box">
       <button class="x" id="m-x">✕</button>
       <div style="margin-top:4px">${html}</div>
     </div>`;
  requestAnimationFrame(() => { $('#m-scrim')?.classList.add('on'); $('#m-box')?.classList.add('on'); });
  $('#m-scrim').onclick = closeModal;
  $('#m-x').onclick = closeModal;
}
function closeModal(){
  const s = $('#m-scrim'), b = $('#m-box');
  if(!s) return;
  s.classList.remove('on'); b.classList.remove('on');
  setTimeout(() => { $('#modal-root').innerHTML = ''; }, 300);
}

/* ---------- drawer ---------- */
const drawer = $('#drawer'), scrim = $('#drawer-scrim');
function toggleDrawer(open){
  drawer.classList.toggle('on', open);
  scrim.classList.toggle('on', open);
}
 $('#btn-drawer').onclick = () => toggleDrawer(true);
scrim.onclick = () => toggleDrawer(false);

/* ---------- shared components ---------- */
function itemEmoji(t){
  const g = t.genres.find(g => GENRE_LIST.some(x => x.name === g));
  return g ? GENRE_EMOJI(g) : TYPES[t.type].emoji;
}
function posterBg(t){
  const h = hueOf(t.title);
  return `background:linear-gradient(155deg,hsl(${h} 62% 36%),hsl(${(h+48)%360} 68% 15%))`;
}
function heroBg(t){
  const h = hueOf(t.title);
  return `background:linear-gradient(150deg,hsl(${h} 58% 24%),hsl(${(h+45)%360} 62% 11%) 72%,#0c0c14)`;
}
function countLabel(t){
  if(t.type === 'movie') return 'فیلم';
  return `${t.episodes.length} ${TYPES[t.type].unit}`;
}
function cardHTML(t){
  return `<a class="card" href="#/detail/${t.id}">
    <div class="poster" style="${posterBg(t)}">
      <span class="p-emoji">${itemEmoji(t)}</span>
      <span class="badge b-rate">⭐ ${t.rating}</span>
      <span class="badge b-type">${TYPES[t.type].short}</span>
      <div class="p-grad"></div>
      <span class="p-title">${esc(t.title)}</span>
    </div>
    <div class="meta"><span>👁 ${fmtViews(t.views)}</span><span>${t.year}</span><span>${countLabel(t)}</span></div>
  </a>`;
}
function gridHTML(list){
  if(!list.length) return `<div class="empty"><i>🫥</i><b>هیچ بابەتێک نەدۆزرایەوە</b><span>لەم کاتەدا شتێک لێرە نییە — دواتر سەردان بکەرەوە</span></div>`;
  return `<div class="grid-cards">${list.map(cardHTML).join('')}</div>`;
}
function emptyBox(icon, title, sub){
  return `<div class="empty"><i>${icon}</i><b>${title}</b><span>${sub}</span></div>`;
}

/* ---------- home ---------- */
let heroTimer = null, heroIdx = 0, heroItems = [];
function renderHome(){
  const newest = DB.filter(t => t.type === 'series').sort((a,b) => b.year - a.year || b.id - a.id).slice(0,10);
  const viewed = [...DB].sort((a,b) => b.views - a.views).slice(0,10);
  const manga  = DB.filter(t => t.type === 'manga' || t.type === 'manhwa').slice(0,10);
  const movies = DB.filter(t => t.type === 'movie').slice(0,10);
  heroItems = [...DB].sort((a,b) => b.rating - a.rating).slice(0,4);
  heroIdx = 0;

  const sec = (title, list, link) => `
    <section>
      <div class="sec-head"><h3>${title}</h3><a href="${link}">هەمووی ←</a></div>
      ${gridHTML(list)}
    </section>`;

  $('#view').innerHTML = `
    <div class="hero" id="hero">
      ${heroItems.map((t,i) => `
        <div class="hero-slide ${i===0?'on':''}" data-i="${i}">

            <div class="hero-chips">

            <span class="p-emoji">${itemEmoji(t)}</span><div class="p-grad"></div>
          </a>
        </div>`).join('')}
      <div class="hero-dots" id="hero-dots">
        ${heroItems.map((_,i) => `<button class="${i===0?'on':''}" data-i="${i}" aria-label="سلایدی ${i+1}"></button>`).join('')}
      </div>
    </div>
    ${sec('نوێترین ئەلقە ژێرنووسکراوەکان', newest, '#/browse/type/series')}

      <div class="join-btns">
        <a class="btn" href="${TG_CHANNEL}" target="_blank" rel="noopener">📡 کەناڵی تێلگرام</a>
        <a class="btn ghost" href="${TG_CHAT}" target="_blank" rel="noopener">گروپی چات 💬</a>
      </div>
    </div>`;

  /* slider logic */
  const slides = $$('#hero .hero-slide'), dots = $$('#hero-dots button');
  function heroGo(i){
    heroIdx = (i + heroItems.length) % heroItems.length;
    slides.forEach((s,j) => s.classList.toggle('on', j === heroIdx));
    dots.forEach((d,j) => d.classList.toggle('on', j === heroIdx));
  }
  function restart(){ clearInterval(heroTimer); heroTimer = setInterval(() => heroGo(heroIdx + 1), 5000); }
  dots.forEach(d => d.onclick = () => { heroGo(+d.dataset.i); restart(); });
  restart();
}

/* ---------- watch / reader (telegram embed) ---------- */
function normLink(l){
  l = (l || '').trim();
  if(!l) return '';
  if(!/^https?:\/\//i.test(l)) l = 'https://' + l;
  return l;
}
function renderWatch(id, n){
  const t = DB.find(x => x.id === id);
  if(!t){ renderHome(); return; }
  const isMovie = t.type === 'movie';
  const isChap = t.type === 'manga' || t.type === 'manhwa';
  const unitLabel = isChap ? 'چاپتەر' : 'ئەلقە';
  const eps = [...t.episodes].sort((a,b) => a.n - b.n);
  let cur = eps.find(e => e.n === n) || eps[0] || null;
  const idx = cur ? eps.indexOf(cur) : -1;
  const prev = idx > 0 ? eps[idx-1] : null;
  const next = idx >= 0 && idx < eps.length-1 ? eps[idx+1] : null;
  const link = cur ? normLink(cur.link) : '';
  const embed = link ? (link.includes('?') ? link + '&embed=1' : link + '?embed=1') : '';

  $('#view').innerHTML = `
    <div class="back-row"><button id="back-btn">→ گەڕانەوە</button></div>
    <div class="page-head" style="margin-top:12px">
      <h2>${esc(t.title)}</h2>
      <p>${isMovie ? 'ئەنیمێ فیلم' : `${unitLabel} ${cur ? cur.n : n}`} — لە کەناڵی Our-World</p>
    </div>
    <div class="player">
      ${link
        ? `<iframe src="${esc(embed)}" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>`
        : `<div class="fallback"><i>📺</i><span>لینکی تێلگرام بۆ ئەم ${isMovie ? 'فیلمە' : (isChap ? 'چاپتەرە' : 'ئەلقەیە')} هێشتا دانەنراوە</span></div>`}
    </div>
    <div class="watch-ctrl">
      ${isMovie ? '' : `
        <button class="btn ghost sm" id="w-prev" ${prev ? '' : 'disabled style="opacity:.4;pointer-events:none"'}>→ ${unitLabel}ی پێشوو</button>
        <button class="btn ghost sm" id="w-next" ${next ? '' : 'disabled style="opacity:.4;pointer-events:none"'}>${unitLabel}ی دواتر ←</button>`}
      ${link ? `<a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">کردنەوە لە تێلگرام ↗</a>` : ''}
    </div>
    <div class="note">⚠️ <span>تێبینی: لە هەندێک مۆدی پیشاندانی سنووردار (وەک sandbox) نەخشەکردنی تێلگرام ڕەنگە بار نەبێت، بەڵام کاتێک ماڵپەرەکە لە هۆستێکی ڕاستەقینەوە کاردەکات، بێ کێشە کار دەکات.</span></div>
    <div class="panel"><h4>${isChap ? 'هەموو چاپتەرەکان' : 'هەموو ئەلقەکان'}</h4>
      ${eps.length ? `<div class="ep-grid">${eps.map(e => `
        <a class="ep ${cur && e.n === cur.n ? 'cur' : (e.link ? '' : 'soon')}" href="#/watch/${t.id}/${e.n}">${unitLabel} ${e.n}${e.link ? '' : '<small>بەم زووانە</small>'}</a>`).join('')}</div>`
      : `<p class="mut" style="font-size:13px">هێشتا هیچ زیاد نەکراوە 🕐</p>`}
    </div>`;

  $('#back-btn').onclick = () => { if(history.length > 1) history.back(); else location.hash = '#/detail/' + t.id; };
  if($('#w-prev') && prev) $('#w-prev').onclick = () => location.hash = `#/watch/${t.id}/${prev.n}`;
  if($('#w-next') && next) $('#w-next').onclick = () => location.hash = `#/watch/${t.id}/${next.n}`;
}

      </div>
      <div class="panel" style="margin-top:6px">
        <form id="auth-form">
          ${isReg ? `<label>ناو</label><input id="a-name" placeholder="ناوی تۆ">` : ''}
          <label>ئیمەیڵ</label><input id="a-email" dir="ltr" placeholder="you@example.com">
          <label>وشەی نهێنی</label><input id="a-pass" type="password" dir="ltr" placeholder="••••••">
          <button class="btn wide" style="margin-top:18px">${isReg ? 'دروستکردنی هەژمار 🎉' : 'چوونەژوورەوە'}</button>
        </form>
        <p class="mut" style="font-size:12px;text-align:center;margin-top:13px">
          ${isReg ? 'هەژمارت هەیە؟' : 'هەژمارت نییە؟'}
          <a href="javascript:void(0)" id="swap" style="color:var(--accent);font-weight:700">${isReg ? 'بچۆ ژوورەوە' : 'خۆت تۆمار بکە'}</a>
        </p>
      </div>
    </div>`;
  $('#tab-login').onclick = () => renderAuth('login');
  $('#tab-reg').onclick = () => renderAuth('register');
  $('#swap').onclick = () => renderAuth(isReg ? 'login' : 'register');
  $('#auth-form').onsubmit = e => {
    e.preventDefault();
    const name = $('#a-name') ? $('#a-name').value.trim() : '';
    const email = $('#a-email').value.trim().toLowerCase();
    const pass = $('#a-pass').value;
    if(isReg && !name){ toast('تکایە ناوی خۆت بنووسە', 'err'); return; }
    if(!email){ toast('تکایە ئیمەیڵەکەت بنووسە', 'err'); return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ toast('ئیمەیڵەکە دروست نییە', 'err'); return; }
    if(!pass){ toast('تکایە وشەی نهێنی بنووسە', 'err'); return; }
    if(pass.length < 4){ toast('وشەی نهێنی دەبێت لانیکەم ٤ پیت بێت', 'err'); return; }
    const users = store.get('ow_users', []);
    if(isReg){
      if(users.some(u => u.email === email)){ toast('ئەم ئیمەیڵە پێشتر تۆمار کراوە', 'err'); return; }
      users.push({ name, email, pass });
      store.set('ow_users', users);
      USER = { name, email };
      store.set('ow_user', USER);
      toast(`هەژمارەکەت دروستکرا — بەخێربێیت ${name} 🎉`);
      location.hash = '#/more';
    } else {
      const u = users.find(u => u.email === email && u.pass === pass);
      if(!u){ toast('هیچ هەژمارێک بەم زانیارییە نییە', 'err'); return; }
      USER = { name:u.name, email:u.email };
      store.set('ow_user', USER);
      toast(`بەخێربێیتەوە ${u.name} 👋`);
      location.hash = '#/more';
    }
  };
}

          <div><label>ساڵ</label><input id="f-year" type="number" placeholder="2024"></div>
          <div><label>هەڵسەنگاندن (0–10)</label><input id="f-rating" type="number" step="0.1" min="0" max="10" placeholder="8.5"></div>
          <div><label>وەرگێڕەر</label><input id="f-trans" placeholder="رەهێڵ / گۆجۆ / تۆیا تۆدۆڕۆکی"></div>
          <div class="full"><label>ژانرەکان (بە کۆما جیابکەرەوە)</label><input id="f-genres" placeholder="ئەکشن, فانتازیا, سەرکێشی"></div>
          <div class="full"><label>باسی چیرۆک</label><textarea id="f-desc" rows="3" placeholder="کورتەیەک لەسەر چیرۆکەکە..."></textarea></div>
        </div>
        <button class="btn" style="margin-top:16px">زیادکردن</button>
      </form>
    </div>
    <div class="panel">
      <h4>بەڕێوەبردنی بابەتەکان (${DB.length})</h4>
      <div id="admin-list">
        ${DB.map(t => `
          <div class="admin-row">
            <a href="#/detail/${t.id}"><b>${esc(t.title)}</b></a>
            <span class="tag acc">${TYPES[t.type].short}</span>
            <span class="tag">${t.type === 'movie' ? 'فیلم' : t.episodes.length + ' ' + TYPES[t.type].unit}</span>
            <div class="ar-btns">
              <button data-add="${t.id}" title="زیادکردنی ئەلقە">➕</button>
              <button data-del="${t.id}" title="سڕینەوە">🗑</button>
            </div>
          </div>`).join('')}
      </div>
    </div>`;

  $('#add-form').onsubmit = e => {
    e.preventDefault();
    const title = $('#f-title').value.trim();
    const year = parseInt($('#f-year').value, 10);
    const rating = parseFloat($('#f-rating').value);
    const genres = $('#f-genres').value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
    if(!title){ toast('تکایە ناوی بابەت بنووسە', 'err'); return; }
    if(!year || year < 1900 || year > 2035){ toast('ساڵەکە دروست نییە (1900–2035)', 'err'); return; }
    if(isNaN(rating) || rating < 0 || rating > 10){ toast('هەڵسەنگاندن دەبێت لە نێوان 0 و 10 بێت', 'err'); return; }
    DB.push({
      id: Math.max(0, ...DB.map(x => x.id)) + 1,
      title, type: $('#f-type').value, year, rating,
      views: Math.floor(200 + Math.random() * 4000),
      translator: $('#f-trans').value.trim(),
      genres: genres.length ? genres : ['ئەکشن'],
      desc: $('#f-desc').value.trim() || 'چیرۆکەکە بەم زووانە زیاد دەکرێت...',
      episodes: []
    });
    saveDB();
    toast('بابەتە نوێیەکە زیادکرا ✓');
    renderAdmin();
  };

  $$('#admin-list [data-add]').forEach(b => b.onclick = () => openEpisodeModal(+b.dataset.add));
  $$('#admin-list [data-del]').forEach(b => b.onclick = () => {
    if(b.classList.contains('armed')){
      DB = DB.filter(x => x.id !== +b.dataset.del);
      saveDB();
      toast('بابەتەکە سڕایەوە ✓');
      renderAdmin();
    } else {
      b.classList.add('armed');
      b.textContent = 'دڵنیای؟';
      setTimeout(() => { if(b.isConnected){ b.classList.remove('armed'); b.textContent = '🗑'; } }, 2800);
    }
  });
}
function openEpisodeModal(itemId){
  const t = DB.find(x => x.id === itemId);
  if(!t) return;
  const nextN = (t.episodes.length ? Math.max(...t.episodes.map(e => e.n)) : 0) + 1;
  const isChap = t.type === 'manga' || t.type === 'manhwa';
  openModal(`
    <h3>➕ زیادکردنی ${isChap ? 'چاپتەر' : 'ئەلقە'} — ${esc(t.title)}</h3>
    <label>ژمارە</label><input id="ep-num" type="number" min="1" value="${nextN}">
    <label>لینکی تێلگرام</label><input id="ep-link" dir="ltr" placeholder="t.me/Our_World13/123">
    <button class="btn wide" style="margin-top:18px" id="ep-save">پاشەکەوتکردن</button>`);
  $('#ep-save').onclick = () => {
    const num = parseInt($('#ep-num').value, 10);
    const link = $('#ep-link').value.trim();
    if(!num || num < 1){ toast('ژمارەیەکی دروست بنووسە', 'err'); return; }
    const ex = t.episodes.find(e => e.n === num);
    if(ex) ex.link = normLink(link);
    else t.episodes.push({ n: num, link: normLink(link) });
    saveDB();
    closeModal();
    toast(ex ? 'لینکی ' + (isChap ? 'چاپتەر' : 'ئەلقە) نوێکرایەوە ✓' : (isChap ? 'چاپتەر' : 'ئەلقە') + 'ەکە پاشەکەوتکرا ✓');
    renderAdmin();
  };
}

/* ---------- router ---------- */
function updateNav(key){
  $$('#bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  $$('#top-links a').forEach(a => a.classList.toggle('active', a.dataset.key === key));
}
function router(){
  clearInterval(heroTimer);
  toggleDrawer(false);
  closeModal();
  window.scrollTo({ top: 0 });
  const segs = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  let key = 'home';
  if(!segs.length || segs[0] === 'home') renderHome();
  else if(segs[0] === 'categories'){ key = 'categories'; renderCategories(); }
  else if(segs[0] === 'search'){ key = 'search'; renderSearch(); }
  else if(segs[0] === 'browse' && segs[1]) renderBrowse(segs[1], segs[2] || 'all');
  else if(segs[0] === 'detail' && segs[1]){ key = ''; renderDetail(+segs[1]); }
  else if(segs[0] === 'watch' && segs[1]){ key = ''; renderWatch(+segs[1], parseInt(segs[2], 10) || 1); }
  else if(segs[0] === 'team'){ key = 'team'; renderTeam(); }
  else if(segs[0] === 'more'){ key = 'more'; renderMore(); }
  else if(segs[0] === 'auth'){ key = ''; renderAuth('login'); }
  else if(segs[0] === 'admin'){ key = 'more'; renderAdmin(); }
  else renderHome();
  updateNav(key);
}
window.addEventListener('hashchange', router);

/* ---------- global header / nav bindings ---------- */
 $('#btn-search').onclick = () => location.hash = '#/search';
 $('#btn-user').onclick = () => location.hash = USER ? '#/more' : '#/auth';
 $('#nav-theme').onclick = openThemeModal;
 $$('#bottom-nav button[data-hash]').forEach(b => b.onclick = () => location.hash = b.dataset.hash);

/* drawer static content */
 $('#drawer-types').innerHTML = Object.entries(TYPES).map(([k,v]) =>
  `<a class="d-tile" href="#/browse/type/${k}"><i>${v.emoji}</i>${v.name}</a>`).join('');
 $('#drawer-genres').innerHTML = GENRE_LIST.map(g =>
  `<a class="d-tile" href="#/browse/genre/${encodeURIComponent(g.name)}"><i>${g.emoji}</i>${esc(g.name)}</a>`).join('');

/* ---------- init ---------- */
router();
</script>
</body>
</html>
